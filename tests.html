<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PotholeGuard - Unit Tests</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 24px;
      line-height: 1.5;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 1.5rem;
    }
    .summary {
      margin-bottom: 20px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .test-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-name {
      font-size: 0.95rem;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .badge.pass {
      background: #065f46;
      color: #34d399;
    }
    .badge.fail {
      background: #991b1b;
      color: #fca5a5;
    }
    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>PotholeGuard — Unit Test Runner</h1>
  <div class="summary" id="summary">Running tests...</div>
  <div id="results"></div>
  <a href="index.html" class="back-link">&larr; Back to App</a>

  <script type="module">
    import { DEFAULT_CONFIG, Config, saveConfig, resetConfig, loadConfig } from './config.js';

    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');

    let passed = 0;
    let failed = 0;

    function assert(name, condition, errorMsg = '') {
      const card = document.createElement('div');
      card.className = 'test-card';

      const label = document.createElement('span');
      label.className = 'test-name';
      label.textContent = name;

      const badge = document.createElement('span');
      if (condition) {
        badge.className = 'badge pass';
        badge.textContent = 'PASS';
        passed++;
      } else {
        badge.className = 'badge fail';
        badge.textContent = 'FAIL';
        label.textContent += ` (${errorMsg})`;
        failed++;
      }

      card.appendChild(label);
      card.appendChild(badge);
      resultsEl.appendChild(card);
    }

    // --- Config Tests ---
    assert(
      'Config has default confidence threshold',
      typeof DEFAULT_CONFIG.confidenceThreshold === 'number' && DEFAULT_CONFIG.confidenceThreshold > 0
    );

    assert(
      'Config has default tracking window and confirm frames',
      DEFAULT_CONFIG.confirmFrames <= DEFAULT_CONFIG.windowFrames
    );

    assert(
      'Config has corridor parameters (horizon, widths)',
      DEFAULT_CONFIG.horizonY > 0 && DEFAULT_CONFIG.corridorBottomWidth > DEFAULT_CONFIG.corridorTopWidth
    );

    assert(
      'Config has camera geometry (height, pitch, FOV)',
      DEFAULT_CONFIG.cameraHeightM > 0 && DEFAULT_CONFIG.vFovDeg > 0
    );

    assert(
      'Config has alert distance bands and thresholds',
      DEFAULT_CONFIG.distWarnMinM < DEFAULT_CONFIG.distWarnMaxM
    );

    // Test Config Mutation and Reset
    const testVal = 0.88;
    saveConfig({ confidenceThreshold: testVal });
    assert(
      'saveConfig updates in-memory Config',
      Config.confidenceThreshold === testVal
    );

    resetConfig();
    assert(
      'resetConfig restores default values',
      Config.confidenceThreshold === DEFAULT_CONFIG.confidenceThreshold
    );

    // Summary
    summaryEl.textContent = `Completed: ${passed} PASSED, ${failed} FAILED`;
    summaryEl.style.color = failed === 0 ? '#34d399' : '#f87171';
  </script>
</body>
</html>
